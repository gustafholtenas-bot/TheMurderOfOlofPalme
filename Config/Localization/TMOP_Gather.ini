[CommonSettings]
SourcePath=Content/Localization/TMOPNative
DestinationPath=Content/Localization/TMOPNative
ManifestName=TMOP.manifest
ArchiveName=TMOP.archive
PortableObjectName=TMOP.po
NativeCulture=sv
CulturesToGenerate=sv
CulturesToGenerate=en

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source
SearchDirectoryPaths=Plugins/TMOPEngine/Source/TMOPEngine
FileNameFilters=*.h
FileNameFilters=*.cpp
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/*
IncludePathFilters=Plugins/TMOPEngine/Content/*
PackageFileNameFilters=*.uasset
PackageFileNameFilters=*.umap
ShouldGatherFromEditorOnlyData=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=InternationalizationExport
bExportLoc=true
bImportLoc=false
